<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pets Upgrade Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <h1>Pets Upgrade Calculator</h1>
    <p>Calculate upgrade costs and SvS points for pets</p>
    <a class="button-link" href="index.html">Back to Home</a>
  </header>
  <main>
    <form id="petCalcForm">
      <label for="petSelect">Pet:</label>
      <select id="petSelect"></select>
      <label for="currentLevel">Current Level:</label>
      <input type="number" id="currentLevel" min="1" value="1">
      <label for="targetLevel">Target Level:</label>
      <input type="number" id="targetLevel" min="1" value="2">
      <button type="submit" class="button-link">Calculate</button>
    </form>
    <div id="petResults" style="margin-top:2em;"></div>
  </main>
  <script src="pets_calc.js"></script>
</body>
</html>
