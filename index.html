<!doctype html>
<html lang="en">
<head>
  <!-- Basic document metadata and asset loading -->
  <!-- CACHE-BUST VERSION: 2026-04-22 v17 -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.gstatic.com; frame-src 'self' https://embersmith-gaming.firebaseapp.com https://*.firebaseapp.com;">
  <meta name="theme-color" content="#071533" />
  <title data-i18n="page.title.index">WOS Calc</title>
  <link rel="manifest" href="manifest.json" />
  <!-- Domain detection: sets APP_MODE and applies kingshot theme before anything renders -->
  <script>
    (function() {
      var host = window.location.hostname;
      var isKingshot = host.includes('kscalculator') || host.includes('ks-local') || window.location.port === '5005';
      window.APP_MODE = isKingshot ? 'kingshot' : 'wos';
      if (isKingshot) {
        document.documentElement.setAttribute('data-app', 'kingshot');
        // Update theme-color meta for Kingshot brand color
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc) tc.setAttribute('content', '#1a0a00');
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
  <!-- i18n.js must load before the overrides; both are deferred in source order -->
  <script src="i18n.js?v=18" defer></script>
  <script id="ksOverrideTag" src="" defer></script>
  <script>
    // Set the override src before defer parsing — blank src is ignored by browsers
    if (window.APP_MODE === 'kingshot') {
      document.getElementById('ksOverrideTag').src = 'kingshot-i18n-overrides.js?v=1';
    }
  </script>
  <script src="script.js?v=18" defer></script>
  <script src="main_spa_loader.js?v=18" defer></script>
</head>
<body>
  <!--
    The page is organized into fieldsets so related controls stay grouped.
    script.js reads these ids directly, so the id values are part of the app's API.
  -->
  <main class="container">
    <div class="top-row">
      <div>
        <h1 data-i18n="app.name">WOS Calc</h1>
      </div>
      <div class="top-controls">
        <select id="languageSelect" class="language-select" data-i18n-aria-label="language.label"></select>
        <button id="forceUpdateBtn" type="button" class="theme-toggle" title="Force Update App (Clears Cache, Keeps Data)">&#x21BB; Update App</button>
        <button id="themeToggleBtn" type="button" class="theme-toggle" data-i18n="theme.darkMode">Dark Mode</button>
        <button id="authBtn" type="button" class="theme-toggle">Login</button>
      </div>
    </div>

    <!-- Account switching controls for the multi-account save system -->
    <div class="account-bar">
      <select id="accountSelect" class="account-select"></select>
      <div class="account-btn-group">
        <button id="renameAccountBtn" type="button" class="account-btn" title="Rename account" data-i18n-title="account.renameTitle">&#9998;</button>
        <button id="addAccountBtn" type="button" class="account-btn account-btn-add" title="Add account" data-i18n-title="account.addTitle" data-i18n="account.addButton">+ Account</button>
        <button id="deleteAccountBtn" type="button" class="account-btn account-btn-delete" title="Delete account" data-i18n-title="account.deleteTitle">&#128465;</button>
      </div>
    </div>

    <nav class="calculator-tabs" aria-label="Calculator tabs" data-i18n-aria-label="nav.calculatorTabs">
      <label for="calculatorDropdown" class="visually-hidden" data-i18n="nav.selectCalculator">Select Calculator</label>
      <select id="calculatorDropdown" class="calculator-dropdown">
        <option value="upgrade" data-i18n="calculator.upgrade">Upgrade</option>
        <option value="chiefGear" data-i18n="calculator.chiefGear">Chief Gear</option>
        <option value="chiefCharm" data-i18n="calculator.chiefCharm">Chief Charm</option>
        <option value="pets" data-i18n="calculator.pets">Pets</option>
        <option value="whatIf" data-i18n="calculator.whatIf">What If</option>
      </select>
    </nav>



    <!-- SPA loader panel: all calculators will be rendered here by JS -->
    <div id="spaPanel"></div>



  </main>

  <!-- GitHub Migration Overlay -->
  <div id="githubMigrationOverlay" class="full-screen-overlay" style="display: none;">
    <div class="overlay-content">
      <h1>App Moved!</h1>
      <p>WOS Calculators has moved to a new permanent home.</p>
      <p>Please update your bookmarks and visit the new site to continue.</p>
      <a href="https://woscalculator.web.app" class="accent-button" style="display:inline-block; margin-top:20px; text-decoration:none; padding:12px 24px;">Go to woscalculator.web.app</a>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="authModal" class="modal-backdrop" style="display: none;">
    <div class="modal-panel">
      <div class="modal-header">
        <h2 id="authModalTitle">Login / Register</h2>
        <button id="closeAuthModal" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div id="authErrorMsg" class="error-message" style="display: none; color: #ff6b6b; margin-bottom: 10px;"></div>
        <input type="email" id="authEmail" placeholder="Email" class="auth-input" />
        <input type="password" id="authPassword" placeholder="Password" class="auth-input" />
        <div class="auth-buttons">
          <button id="loginBtn" class="accent-button">Login</button>
          <button id="registerBtn" class="secondary-button">Register</button>
        </div>
        <div class="auth-divider"><span>OR</span></div>
        <button id="googleAuthBtn" class="google-button">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="18" height="18" />
          Continue with Google
        </button>
        <div id="loggedInView" style="display: none; text-align: center;">
          <p>Logged in as: <span id="loggedInEmail" style="font-weight: bold;"></span></p>
          <button id="logoutBtn" class="secondary-button" style="margin-top: 15px;">Logout</button>
        </div>
      </div>
    </div>
  </div>

  <!-- App Auth Logic -->
  <script type="module" src="auth.js"></script>
</body>
</html>
