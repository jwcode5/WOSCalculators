<!doctype html>
<html lang="en">
<head>

  <!-- Basic document metadata and asset loading -->
  <!-- CACHE-BUST VERSION: 2026-04-22 v17 -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://www.gstatic.com; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.gstatic.com; frame-src 'self' https://embersmith-gaming.firebaseapp.com https://*.firebaseapp.com https://*.web.app;">
  <meta name="theme-color" content="#071533" />
  <title data-i18n="page.title.index">WOS Calc</title>
  <link rel="manifest" href="manifest.json" />
  <!-- Domain detection: sets APP_MODE and applies kingshot theme before anything renders -->
  <script>
    (function() {
      var host = window.location.hostname;
      var isKingshot = host.includes('kscalculator') || host.includes('ks-local') || window.location.port === '5005';
      window.APP_MODE = isKingshot ? 'kingshot' : 'wos';
      if (isKingshot) {
        document.documentElement.setAttribute('data-app', 'kingshot');
        // Update theme-color meta for Kingshot brand color
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc) tc.setAttribute('content', '#1a0a00');
      }
    })();
  </script>
  <link rel="stylesheet" href="ui/styles.css" />
  <!-- i18n.js must load before the overrides; both are deferred in source order -->
  <script src="i18n.js?v=19" defer></script>
  <script id="ksOverrideTag" src="" defer></script>
  <script>
    // Set the override src before defer parsing â€” blank src is ignored by browsers
    if (window.APP_MODE === 'kingshot') {
      document.getElementById('ksOverrideTag').src = 'kingshot-i18n-overrides.js?v=1';
    }
  </script>
              
  

</head>
<body>
  <!-- Fixed Main Menu -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <h1 data-i18n="app.name">WOS Calc</h1>
      <button id="mobileMenuBtn" class="icon-btn mobile-only" style="display: none; font-size: 1.5rem; background: none; border: none; color: var(--text-primary);">☰</button>
    </div>
    
    <div class="header-actions">
        <button id="themeToggleBtn" class="icon-btn theme-toggle-icon" title="Toggle Theme">🌙</button>
        <button id="languageMenuBtn" class="icon-btn" title="Language">🌐</button>
        <button id="authBtn" class="icon-btn profile-btn" title="Login">L</button>
      </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-route="upgrade">Buildings</button>
      <button class="nav-item" data-route="chiefGear">Chief Gear</button>
      <button class="nav-item" data-route="chiefCharm">Chief Charm</button>
      <button class="nav-item" data-route="pets">Pets</button>
      <button class="nav-item" data-route="experts">Experts</button>
      <button class="nav-item" data-route="svs">SvS Calculator</button>
    </nav>
    
    <div class="sidebar-footer" style="padding: 16px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--glass-border);">
      <div class="account-controls" style="display: flex; gap: 8px;">
        <select id="accountSelect" class="account-select global-select" style="flex: 1; padding: 10px;"></select>
        <button id="addAccountBtn" class="icon-btn" title="Add Account" style="background: var(--bg-accent); width: 42px; height: 42px; border-radius: 8px;">+</button>
      </div>
      <div class="global-controls" style="display: flex;">
        <select id="globalValeriaSkill" class="global-select" style="flex: 1; padding: 10px;">
          <option value="0">Well Prepared (0%)</option>
          <option value="1">Level 1 (2%)</option>
          <option value="2">Level 2 (4%)</option>
          <option value="3">Level 3 (6%)</option>
          <option value="4">Level 4 (8%)</option>
          <option value="5">Level 5 (10%)</option>
          <option value="6">Level 6 (12%)</option>
          <option value="7">Level 7 (14%)</option>
          <option value="8">Level 8 (16%)</option>
          <option value="9">Level 9 (18%)</option>
          <option value="10">Level 10 (20%)</option>
        </select>
      </div>
      <select id="languageSelect" class="language-select" style="display: none;" data-i18n-aria-label="language.label"></select>
      <button id="forceUpdateBtn" class="secondary-button" style="padding: 10px; font-size: 0.9em;">Update App</button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main id="main-content">
    <!-- Global Account/Data Bar -->
    

    <!-- Active Calculator Injection Point -->
    <div id="app-content">
      <!-- UI Modules will render here -->
    </div>
  </main>

  
  <!-- Language Modal -->
  <div id="languageModal" class="modal-backdrop" style="display: none; z-index: 1000;">
    <div class="modal-panel" style="max-width: 400px; padding: 24px;">
      <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); padding-bottom: 12px; margin-bottom: 16px;">
        <h2 data-i18n="language.label" style="margin: 0;">Language</h2>
        <button id="closeLanguageModal" class="close-btn" style="background: none; border: none; color: var(--text-primary); font-size: 1.5rem; cursor: pointer;">&times;</button>
      </div>
      <div class="modal-body" id="languageGrid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: 400px; overflow-y: auto;">
        <!-- Language buttons injected by script -->
      </div>
    </div>
  </div>

  <!-- Auth Modal (Preserved) -->
  <div id="authModal" class="modal-backdrop" style="display: none;">
    <div class="modal-panel">
      <div class="modal-header">
        <h2 id="authModalTitle">Login / Register</h2>
        <button id="closeAuthModal" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div id="authErrorMsg" class="error-message" style="display: none; color: #ff6b6b; margin-bottom: 10px;"></div>
        <input type="email" id="authEmail" placeholder="Email" class="auth-input" />
        <input type="password" id="authPassword" placeholder="Password" class="auth-input" />
        <div class="auth-buttons">
          <button id="loginBtn" class="accent-button">Login</button>
          <button id="registerBtn" class="secondary-button">Register</button>
        </div>
        <div class="auth-divider"><span>OR</span></div>
        <button id="googleAuthBtn" class="google-button" style="display: flex; gap: 8px; justify-content: center;">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo" style="width: 20px; height: 20px;">
          Continue with Google
        </button>
        <div id="loggedInView" style="display: none; text-align: center;">
          <p>Logged in as: <span id="loggedInEmail" style="font-weight: bold;"></span></p>
          <button id="logoutBtn" class="secondary-button" style="margin-top: 15px;">Logout</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Core Logic Scripts -->
  <script src="logic/upgradeMath.js" defer></script>
  <script src="logic/gearMath.js" defer></script>
  <script src="logic/charmMath.js" defer></script>
  <script src="logic/petMath.js" defer></script>
  <script src="logic/expertMath.js" defer></script>
  <script src="logic/svsMath.js" defer></script>
  <script src="script.js?v=33" defer></script>
  
  <!-- App Auth Logic -->
  <script type="module" src="auth.js"></script>
  <!-- New SPA Router -->
  <script type="module" src="ui/router.js?v=33"></script>
</body>
</html>
