<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WOS Calculator - Lesson 4</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <div class="top-row">
      <div>
        <h1>WOS Calculator</h1>
        <p>Lesson 4: Multi-building calculator with prerequisites.</p>
      </div>
      <button id="themeToggleBtn" type="button" class="theme-toggle">Dark Mode</button>
    </div>

    <!-- Target Building Selection -->
    <fieldset>
      <legend>Target Building</legend>
      <label for="targetBuilding">Building</label>
      <select id="targetBuilding">
        <option value="furnace">Furnace</option>
        <option value="embassy">Embassy</option>
        <option value="research_center">Research Center</option>
        <option value="infirmary">Infirmary</option>
        <option value="infantry_camp">Infantry Camp</option>
        <option value="lancer_camp">Lancer Camp</option>
        <option value="marksman_camp">Marksman Camp</option>
        <option value="barricade">Barricade</option>
        <option value="command_center">Command Center</option>
        <option value="storehouse">Storehouse</option>
      </select>

      <div style="display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-top: 10px;">
        <div style="flex: 1 1 180px; min-width: 150px;">
          <label for="currentLevel">Current Level</label>
          <select id="currentLevel"></select>
        </div>
        <div style="flex: 1 1 180px; min-width: 150px;">
          <label for="targetLevel">Target (Goal) Level</label>
          <select id="targetLevel"></select>
        </div>
      </div>
    </fieldset>

    <!-- Backpack Resources -->
    <fieldset>
      <legend>Your Resources</legend>
      <label for="ownedMeat">Meat</label>
      <input id="ownedMeat" type="text" value="0" inputmode="text" placeholder="e.g. 953.14M" />

      <label for="ownedWood">Wood</label>
      <input id="ownedWood" type="text" value="0" inputmode="text" placeholder="e.g. 953.14M" />

      <label for="ownedCoal">Coal</label>
      <input id="ownedCoal" type="text" value="0" inputmode="text" placeholder="e.g. 953.14M" />

      <label for="ownedIron">Iron</label>
      <input id="ownedIron" type="text" value="0" inputmode="text" placeholder="e.g. 953.14M" />

      <label for="generalSpeedups">General Speedups (minutes)</label>
      <input id="generalSpeedups" type="number" min="0" value="0" />

      <label for="constructionSpeedups">Construction Speedups (minutes)</label>
      <input id="constructionSpeedups" type="number" min="0" value="0" />
    </fieldset>

    <fieldset>
      <legend>Construction Buffs (%)</legend>
      <label for="doubleTimeEnabled" class="checkbox-row">
        <input id="doubleTimeEnabled" type="checkbox" />
        Double Time (20%)
      </label>

      <label for="castleBuffEnabled" class="checkbox-row">
        <input id="castleBuffEnabled" type="checkbox" />
        Castle Buff (10%)
      </label>

      <label for="constructionSpeedPct">Construction Speed</label>
      <input id="constructionSpeedPct" type="number" min="0" step="0.1" value="0" />

      <label for="hyenaBuffPct">Builder's Aide (Hyena) Buff</label>
      <select id="hyenaBuffPct">
        <option value="" selected>None (0%)</option>
        <option value="5">5%</option>
        <option value="7">7%</option>
        <option value="9">9%</option>
        <option value="12">12%</option>
        <option value="15">15%</option>
      </select>

      <label for="positionBuffPct">Position Buff</label>
      <input id="positionBuffPct" type="number" min="0" step="0.1" value="0" />
    </fieldset>

    <!-- Prerequisites Section -->
    <fieldset id="prerequisitesSection" style="display: none;">
      <legend>Required Buildings</legend>
      <div id="prerequisitesContainer"></div>
    </fieldset>

    <!-- Optional Additional Buildings Section -->
    <fieldset id="optionalBuildingsSection">
      <legend>Optional Additional Buildings</legend>
      <div id="optionalBuildingsContainer"></div>
      <button id="addBuildingBtn" type="button">+ Add Building</button>
    </fieldset>

    <button id="calculateBtn" type="button">Calculate</button>

    <section id="result" class="result">Loading building data...</section>
  </main>
</body>
</html>
